<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>광명시 공시지가 대시보드</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--muted:#6b7280;--line:#e5e7eb;--up:#d1495b;--down:#2e6fd1;--warn:#b45309;--warnbg:#fff7e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;font-size:14px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;padding:16px 20px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
.sub{color:var(--muted);font-size:12px}
main{padding:16px 20px;display:grid;gap:16px;max-width:1300px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .l{color:var(--muted);font-size:12px}.kpi .v{font-size:22px;font-weight:700;margin-top:4px}
.kpi.warn{background:var(--warnbg);border-color:#f3d19c}.kpi.warn .v{color:var(--warn)}
.row{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:900px){.row{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#map{height:420px;border-radius:8px}
.legend{font-size:12px;color:var(--muted);margin-top:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th{background:#f9fafb;position:sticky;top:0;color:var(--muted);font-weight:600}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr.sel td{background:#eef4ff}
.tbl tbody tr{cursor:pointer}
.scroll{max-height:420px;overflow:auto}
.up{color:var(--up)}.down{color:var(--down)}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;background:var(--warnbg);color:var(--warn);border:1px solid #f3d19c;margin:1px}
button,select,label.btn{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.bar{height:8px;background:#c7d2fe;border-radius:4px}
.left{text-align:left!important}
</style>
</head>

<header>

  <div style="display:flex;gap:8px;align-items:center">

    <label class="btn">다른 CSV 열기<input type="file" id="file" accept=".csv" hidden></label>
  </div>
</header>
<main>

    <div class="card">

  <section class="card">

};
const DONG_CODE = {"101":"광명동","102":"철산동","103":"하안동","104":"소하동","105":"일직동","106":"노온사동","107":"가학동","108":"옥길동"};
const RATE_LIMIT = 10; // 변동률 ±10% 초과 시 확인 대상

const fmt = n => n==null||isNaN(n) ? "-" : Math.round(n).toLocaleString("ko-KR");
const pct = n => n==null||isNaN(n) ? "-" : (n>0?"+":"")+n.toFixed(2)+"%";
const cls = n => n>0?"up":n<0?"down":"";

function parseCSV(text){
  text = text.replace(/^﻿/,"");
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  const head = lines[0].split(",").map(s=>s.trim());
  return lines.slice(1).map(l=>{const c=l.split(",");const o={};head.forEach((h,i)=>o[h]=(c[i]??"").trim());return o;});
}

let rows=[], sel=null, map, layer;

function load(text, label){
  rows = parseCSV(text).map(r=>{
    const p25 = r["공시지가_2025"]===""?null:+r["공시지가_2025"];
    const p26 = r["공시지가_2026"]===""?null:+r["공시지가_2026"];
    return {...r, p25, p26, area:+r["면적_㎡"], rate:(p25&&p26)?(p26/p25-1)*100:null, issues:[]};
  });
  validate();
  if(label) document.getElementById("src").textContent = label+" · 2025 → 2026 · 데이터 검증 포함";
  sel=null; render();
}

function validate(){
  const cnt={}; rows.forEach(r=>cnt[r.PNU]=(cnt[r.PNU]||0)+1);
  rows.forEach(r=>{
    const add=t=>r.issues.push(t), pnu=r.PNU;
    if(r.p25==null) add("2025 공시지가 결측");
    if(r.p26==null) add("2026 공시지가 결측");
    if(!/^\d{19}$/.test(pnu)) add("PNU 자릿수 오류");
    if(cnt[pnu]>1) add("PNU 중복");
    if(!r["지목"]) add("지목 누락");
    if(!(r.area>0)) add("면적 오류");
    if(r.rate!=null && Math.abs(r.rate)>RATE_LIMIT) add("변동률 ±"+RATE_LIMIT+"% 초과");
    if(!r["지번"]) add("지번 누락");
    if(/^\d{19}$/.test(pnu)){
      if(DONG_CODE[pnu.slice(5,8)] && DONG_CODE[pnu.slice(5,8)]!==r["법정동"]) add("PNU-법정동 불일치");
      const bon=+pnu.slice(11,15), bu=+pnu.slice(15,19), jibun=bu?bon+"-"+bu:""+bon;
      if(r["지번"] && jibun!==r["지번"].replace(/^산\s*/,"")) add("PNU-지번 불일치");
    }
    if(r["지번"] && r["소재지"] && !r["소재지"].endsWith(r["법정동"]+" "+r["지번"])) add("소재지 표기 불일치");
  });
}

const filtered = () => sel ? rows.filter(r=>r["법정동"]===sel) : rows;
const avg = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;

function render(){
  const R = filtered();
  document.getElementById("filterNote").textContent = sel ? sel+" 선택됨" : "전체 법정동";
  const v26=R.map(r=>r.p26).filter(x=>x!=null), rates=R.map(r=>r.rate).filter(x=>x!=null);
  const bad=R.filter(r=>r.issues.length);
  const kpi=[["필지 수",fmt(R.length)+" 필지"],["평균 공시지가 2026",fmt(avg(v26))+" 원/㎡"],
    ["평균 변동률",`<span class="${cls(avg(rates))}">${pct(avg(rates))}</span>`],
    ["상승 / 하락 필지",`${rates.filter(x=>x>0).length} / ${rates.filter(x=>x<0).length}`],
    ["검증 확인 대상",fmt(bad.length)+" 건","warn"]];
  document.getElementById("kpis").innerHTML = kpi.map(([l,v,c])=>`<div class="kpi ${c||""}"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");
  renderDong(); renderMap(); renderIssues(bad); renderParcels(R);
}

function dongStats(){
  const g={}; rows.forEach(r=>(g[r["법정동"]]??=[]).push(r));
  return Object.entries(g).map(([d,a])=>({d,n:a.length,
    p26:avg(a.map(r=>r.p26).filter(x=>x!=null)),
    rate:avg(a.map(r=>r.rate).filter(x=>x!=null)),
    bad:a.filter(r=>r.issues.length).length})).sort((a,b)=>b.p26-a.p26);
}

function renderDong(){
  const s=dongStats(), max=Math.max(...s.map(x=>x.p26));
  document.getElementById("dongTbl").innerHTML = `<thead><tr><th>법정동</th><th>필지</th><th>평균 2026 (원/㎡)</th><th>평균 변동률</th><th>검증</th></tr></thead><tbody>`+
    s.map(x=>`<tr data-d="${x.d}" class="${x.d===sel?"sel":""}"><td>${x.d}</td><td>${x.n}</td>
      <td>${fmt(x.p26)}<div class="bar" style="width:${x.p26/max*100}%;margin-left:auto"></div></td>
      <td class="${cls(x.rate)}">${pct(x.rate)}</td><td>${x.bad?`<span class="tag">${x.bad}</span>`:"-"}</td></tr>`).join("")+"</tbody>";
  document.querySelectorAll("#dongTbl tbody tr").forEach(tr=>tr.onclick=()=>pick(tr.dataset.d));
}

function rateColor(r){
  if(r==null) return "#9ca3af";
  if(r<0) return "#2e6fd1";
  if(r<2) return "#fcd5b5"; if(r<4) return "#f59e7a"; if(r<6) return "#e8665a"; return "#b3263a";
}

function renderMap(){
  if(!window.L){document.getElementById("map").innerHTML='<p class="sub" style="padding:20px">지도 라이브러리를 불러오지 못했습니다(인터넷 연결 확인).</p>';return;}
  if(!map){
    map=L.map("map",{scrollWheelZoom:false}).setView([37.452,126.866],13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(map);
    layer=L.layerGroup().addTo(map);
  }
  layer.clearLayers();
  dongStats().forEach(x=>{
    const c=DONG[x.d]; if(!c) return;
    L.circleMarker(c,{radius:8+Math.sqrt(x.n)*2.2,color:x.d===sel?"#111":"#fff",weight:x.d===sel?3:1.5,fillColor:rateColor(x.rate),fillOpacity:.85})
      .bindTooltip(`<b>${x.d}</b><br>필지 ${x.n} · 평균 ${fmt(x.p26)}원/㎡<br>변동률 ${pct(x.rate)}${x.bad?`<br>검증 확인 ${x.bad}건`:""}`)
      .on("click",()=>pick(x.d)).addTo(layer);
    L.marker(c,{icon:L.divIcon({className:"",html:`<div style="font-size:11px;font-weight:700;transform:translate(-50%,18px);white-space:nowrap;text-shadow:0 0 3px #fff">${x.d}</div>`})}).addTo(layer);
  });
}

function renderIssues(bad){
  const types=[...new Set(rows.flatMap(r=>r.issues))];
  const f=document.getElementById("issueFilter"), cur=f.value;
  f.innerHTML='<option value="">모든 항목</option>'+types.map(t=>`<option ${t===cur?"selected":""}>${t}</option>`).join("");
  const list=cur?bad.filter(r=>r.issues.includes(cur)):bad;
  document.getElementById("issueTbl").innerHTML = `<thead><tr><th>연번</th><th class="left">PNU</th><th class="left">소재지</th><th>지목</th><th>2025</th><th>2026</th><th>변동률</th><th class="left">검증 항목</th></tr></thead><tbody>`+
    (list.length?list.map(r=>`<tr><td>${r["연번"]}</td><td class="left">${r.PNU}</td><td class="left">${r["소재지"]}</td><td>${r["지목"]||"-"}</td><td>${fmt(r.p25)}</td><td>${fmt(r.p26)}</td><td class="${cls(r.rate)}">${pct(r.rate)}</td><td class="left">${r.issues.map(t=>`<span class="tag">${t}</span>`).join("")}</td></tr>`).join("")
      :`<tr><td colspan="8" class="left sub">확인 대상이 없습니다.</td></tr>`)+"</tbody>";
}

function renderParcels(R){
  document.getElementById("parcelCount").textContent=R.length+"건";
  document.getElementById("parcelTbl").innerHTML = `<thead><tr><th>연번</th><th class="left">소재지</th><th>지목</th><th>면적(㎡)</th><th class="left">용도지역</th><th>2025</th><th>2026</th><th>변동률</th></tr></thead><tbody>`+
    R.map(r=>`<tr><td>${r["연번"]}</td><td class="left">${r["소재지"]}</td><td>${r["지목"]||"-"}</td><td>${fmt(r.area)}</td><td class="left">${r["용도지역"]}</td><td>${fmt(r.p25)}</td><td>${fmt(r.p26)}</td><td class="${cls(r.rate)}">${pct(r.rate)}</td></tr>`).join("")+"</tbody>";
}

function pick(d){ sel = sel===d ? null : d; render(); }
document.getElementById("reset").onclick=()=>{sel=null;render();};
document.getElementById("issueFilter").onchange=()=>renderIssues(filtered().filter(r=>r.issues.length));
document.getElementById("file").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{let t=new TextDecoder("utf-8").decode(rd.result); if(t.includes("�")) t=new TextDecoder("euc-kr").decode(rd.result); load(t,f.name);};
  rd.readAsArrayBuffer(f);
};
load(CSV_TEXT, "4. 광명시_개별공시지가_실습용.csv");
</script>
</body>
</html>
